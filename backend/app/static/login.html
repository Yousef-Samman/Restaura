<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F2">
<title>Restaura · Sign in</title>
<link rel="icon" href="/static/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Josefin+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="auth">
  <div class="box">
    <div class="brand"><span class="mark"><img src="/static/logo.svg" alt=""></span>
      <div><div class="wordmark">RESTAURA<small>MMXXVI</small></div><div class="tag" id="tag">AI agents for the restaurant.</div></div></div>

    <!-- first page: who is using this device -->
    <div id="choose" class="form" hidden>
      <div class="q">How are you signing in?</div>
      <div class="role-grid">
        <button type="button" class="role" id="as-manager"><span class="ic" id="ic-manager"></span><span><b>Manager</b><small>Run the store from your phone or laptop</small></span><span class="chev" data-chev></span></button>
        <button type="button" class="role" id="as-cashier"><span class="ic" id="ic-cashier"></span><span><b>Cashier</b><small>Take orders on the store's iPad</small></span><span class="chev" data-chev></span></button>
      </div>
    </div>

    <!-- demo mode: try the app in one tap -->
    <div id="demo" class="demo" hidden>
      <div class="q">Trying the demo?</div>
      <div class="demo-grid">
        <button type="button" class="solid" id="demo-manager">Open the manager app</button>
        <button type="button" class="solid alt" id="demo-cashier">Open the cashier iPad</button>
      </div>
      <div class="demo-hint" id="demo-hint"></div>
    </div>

    <form id="login" class="form" hidden>
      <button type="button" class="backrow" data-back></button>
      <div class="q">Manager sign-in</div>
      <div class="err" id="err" hidden></div>
      <label class="field">Username<input id="u" autocomplete="username" autocapitalize="none" required></label>
      <label class="field">Password<input id="p" type="password" autocomplete="current-password" required></label>
      <button class="solid" type="submit">Sign in</button>
    </form>

    <!-- cashier on an iPad that is not paired yet: the 6-digit code from the manager app, entered once -->
    <div id="pair" class="form" hidden>
      <button type="button" class="backrow" data-back></button>
      <div class="stepdots"><i class="on"></i><i></i></div>
      <div class="q">Enter this iPad's code</div>
      <div class="err" id="perr" hidden></div>
      <div class="code-boxes" id="boxes"></div>
      <div class="keys" id="ckeys"></div>
      <div class="hint"><span id="ic-hint"></span><span>The manager gets the 6-digit code in the manager app under More › Cashier iPads › Pair a cashier iPad. You enter it once per iPad.</span></div>
    </div>

    <!-- on the paired cashier iPad: each staff member taps their name and enters their PIN -->
    <div id="staff" class="form" hidden>
      <button type="button" class="backrow" data-back></button>
      <div class="stepdots" id="staff-dots"><i class="on"></i><i class="on"></i></div>
      <div class="q">Who is signing in?</div>
      <div class="err" id="serr" hidden></div>
      <div class="who-grid" id="who"></div>
      <div id="pinbox" hidden>
        <div class="tag" id="pin-for"></div>
        <div class="pin-dots" id="dots"></div>
        <div class="keys" id="keys"></div>
      </div>
      <div class="tag devname" id="devstate"></div>
    </div>
  </div>
</main>
<script src="/static/icons.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || "Something went wrong");
  return j;
}
const KEYS = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"];
const keypad = (el, onKey) => {
  el.innerHTML = KEYS.map((k) => `<button type="button" ${k ? "" : "disabled"} data-k="${k}" aria-label="${k === "⌫" ? "Delete" : k}">${k}</button>`).join("");
  el.querySelectorAll("button").forEach((b) => (b.onclick = () => onKey(b.dataset.k)));
};
let paired = false, who = null, pin = "", code = "", busy = false;
const show = (view) => { for (const v of ["choose", "login", "pair", "staff"]) $(v).hidden = v !== view; };

async function loadStaff() {
  const staff = await fetch("/api/auth/staff").then((r) => r.json()).catch(() => []);
  $("who").innerHTML = staff.map((m) => `<button type="button" data-id="${m.id}" data-name="${esc(m.name)}"><b>${esc(m.name)}</b><small>${esc(m.role)}</small></button>`).join("");
  $("who").querySelectorAll("button").forEach((b) => (b.onclick = () => {
    who = +b.dataset.id; pin = ""; dots();
    $("who").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    $("pin-for").textContent = `${b.dataset.name}, enter your 4-digit PIN`;
    $("pinbox").hidden = false; $("serr").hidden = true;
  }));
}
async function refresh() {
  const me = await fetch("/api/auth/me").then((r) => r.json());
  if (me.user) location.href = me.user.role === "cashier" ? "/cashier" : "/manager";
  paired = !!me.device;
  $("devstate").textContent = paired ? `This iPad: ${me.device.name}` : "";
  if (paired) await loadStaff();
}
function dots() { $("dots").innerHTML = [0, 1, 2, 3].map((i) => `<i class="${i < pin.length ? "on" : ""}"></i>`).join(""); }
function boxes() { $("boxes").innerHTML = [0, 1, 2, 3, 4, 5].map((i) => `<i class="${i === code.length ? "cur" : ""}">${code[i] || ""}</i>`).join(""); }

async function pinKey(k) {
  if (k === "⌫") pin = pin.slice(0, -1); else if (k && pin.length < 4) pin += k;
  dots();
  if (pin.length < 4) return;
  try { const r = await post("/api/auth/staff-login", { staff_id: who, pin }); location.href = r.home; }
  catch (x) { $("serr").textContent = x.message; $("serr").hidden = false; pin = ""; dots(); }
}
async function codeKey(k) {
  if (busy) return;
  if (k === "⌫") code = code.slice(0, -1); else if (k && code.length < 6) code += k;
  $("perr").hidden = true; boxes();
  if (code.length < 6) return;
  busy = true;
  try { await post("/api/devices/pair", { code }); await refresh(); $("staff-dots").hidden = false; show("staff"); }
  catch (x) { $("perr").textContent = x.message; $("perr").hidden = false; code = ""; boxes(); }
  busy = false;
}
keypad($("keys"), pinKey);
keypad($("ckeys"), codeKey);
$("ic-manager").innerHTML = ICONS.manager;
$("ic-cashier").innerHTML = ICONS.device;
$("ic-hint").innerHTML = ICONS.device;
document.querySelectorAll("[data-chev]").forEach((e) => (e.innerHTML = ICONS.chevron));
document.querySelectorAll("[data-back]").forEach((b) => {
  b.innerHTML = `${ICONS.back}Back`;
  b.onclick = () => { $("err").hidden = $("perr").hidden = $("serr").hidden = true; show("choose"); };
});
$("as-manager").onclick = () => { show("login"); $("u").focus(); };
$("as-cashier").onclick = () => {
  if (paired) { $("staff-dots").hidden = true; show("staff"); }
  else { code = ""; boxes(); show("pair"); }
};
$("login").onsubmit = async (e) => {
  e.preventDefault(); $("err").hidden = true;
  try { const r = await post("/api/auth/login", { username: $("u").value, password: $("p").value }); location.href = r.home; }
  catch (x) { $("err").textContent = x.message; $("err").hidden = false; }
};
async function demoSignIn(role) {
  try { const r = await post(`/api/auth/demo/${role}`, {}); location.href = r.home; }
  catch (x) { $("err").textContent = x.message; $("err").hidden = false; show("login"); }
}
$("demo-manager").onclick = () => demoSignIn("manager");
$("demo-cashier").onclick = () => demoSignIn("cashier");
fetch("/api/auth/demo").then((r) => r.json()).then((d) => {
  if (!d.enabled) return;
  $("demo").hidden = false;
  $("demo-hint").innerHTML = `Demo logins: <b>manager</b> / <b>${esc(d.manager_password)}</b>, and on the cashier iPad your name with PIN <b>${esc(d.staff_pins)}</b> (Sara is 1111).`;
}).catch(() => {});
show("choose");
refresh();
</script>
</body>
</html>
