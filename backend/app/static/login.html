<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF9F2">
<title>Restaura · Sign in</title>
<link rel="icon" href="/static/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Josefin+Sans:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<main class="auth">
  <div class="box">
    <div class="brand"><span class="mark"><img src="/static/logo.svg" alt=""></span>
      <div><div class="wordmark">RESTAURA<small>MMXXVI</small></div><div class="tag" id="tag">Eight agents. One restaurant.</div></div></div>

    <!-- on the paired cashier iPad: each staff member taps their name and enters their PIN -->
    <div id="staff" class="form" hidden>
      <div class="err" id="serr" hidden></div>
      <div class="field">Who is signing in?</div>
      <div class="who-grid" id="who"></div>
      <div id="pinbox" hidden>
        <div class="tag" id="pin-for"></div>
        <div class="pin-dots" id="dots"></div>
        <div class="keys" id="keys"></div>
      </div>
      <button type="button" id="to-manager" class="muted linkish">Manager sign-in</button>
    </div>

    <form id="login" class="form" hidden>
      <div class="err" id="err" hidden></div>
      <label class="field">Username<input id="u" autocomplete="username" autocapitalize="none" required></label>
      <label class="field">Password<input id="p" type="password" autocomplete="current-password" required></label>
      <button class="solid" type="submit">Sign in</button>
      <button type="button" id="to-staff" class="muted linkish" hidden>Staff sign-in with PIN</button>
    </form>

    <form id="pair" class="form" hidden>
      <div class="err" id="perr" hidden></div>
      <div class="tag">Enter the 6-digit code from the manager app to make this iPad the cashier station.</div>
      <label class="field">Pairing code<input id="code" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" required></label>
      <button class="solid" type="submit">Pair this device</button>
      <button type="button" id="back" class="muted linkish">Back to sign in</button>
    </form>
    <div class="devline"><span id="devstate"></span><button type="button" id="topair">Pair as cashier iPad</button></div>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
async function post(path, body) {
  const r = await fetch(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || "Something went wrong");
  return j;
}
let paired = false, who = null, pin = "";
const show = (view) => { for (const v of ["staff", "login", "pair"]) $(v).hidden = v !== view; $("to-staff").hidden = !paired; };

async function refresh() {
  const me = await fetch("/api/auth/me").then((r) => r.json());
  if (me.user) location.href = me.user.role === "cashier" ? "/cashier" : "/manager";
  paired = !!me.device;
  $("devstate").textContent = paired ? `This device: ${me.device.name}` : "This device is not a cashier station";
  $("topair").hidden = paired;
  if (!paired) return show("login");
  const staff = await fetch("/api/auth/staff").then((r) => r.json()).catch(() => []);
  $("who").innerHTML = staff.map((m) => `<button type="button" data-id="${m.id}" data-name="${esc(m.name)}"><b>${esc(m.name)}</b><small>${esc(m.role)}</small></button>`).join("");
  $("who").querySelectorAll("button").forEach((b) => (b.onclick = () => {
    who = +b.dataset.id; pin = ""; dots();
    $("who").querySelectorAll("button").forEach((x) => x.setAttribute("aria-pressed", x === b));
    $("pin-for").textContent = `${b.dataset.name}, enter your 4-digit PIN`;
    $("pinbox").hidden = false; $("serr").hidden = true;
  }));
  show("staff");
}
function dots() { $("dots").innerHTML = [0, 1, 2, 3].map((i) => `<i class="${i < pin.length ? "on" : ""}"></i>`).join(""); }
async function key(k) {
  if (k === "⌫") pin = pin.slice(0, -1); else if (k && pin.length < 4) pin += k;
  dots();
  if (pin.length < 4) return;
  try { const r = await post("/api/auth/staff-login", { staff_id: who, pin }); location.href = r.home; }
  catch (x) { $("serr").textContent = x.message; $("serr").hidden = false; pin = ""; dots(); }
}
$("keys").innerHTML = ["1", "2", "3", "4", "5", "6", "7", "8", "9", "", "0", "⌫"].map((k) => `<button type="button" ${k ? "" : "disabled"} data-k="${k}">${k}</button>`).join("");
$("keys").querySelectorAll("button").forEach((b) => (b.onclick = () => key(b.dataset.k)));
$("topair").onclick = () => show("pair");
$("back").onclick = () => show(paired ? "staff" : "login");
$("to-manager").onclick = () => show("login");
$("to-staff").onclick = () => show("staff");
$("login").onsubmit = async (e) => {
  e.preventDefault(); $("err").hidden = true;
  try { const r = await post("/api/auth/login", { username: $("u").value, password: $("p").value }); location.href = r.home; }
  catch (x) { $("err").textContent = x.message; $("err").hidden = false; }
};
$("pair").onsubmit = async (e) => {
  e.preventDefault(); $("perr").hidden = true;
  try { await post("/api/devices/pair", { code: $("code").value }); refresh(); }
  catch (x) { $("perr").textContent = x.message; $("perr").hidden = false; }
};
refresh();
</script>
</body>
</html>
