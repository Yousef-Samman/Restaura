<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaura · Cashier</title>
<link rel="icon" href="/static/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Noto+Sans+Arabic:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="pos">
  <nav class="rail" aria-label="Menu categories">
    <div class="logo"><img src="/static/logo.svg" alt="Restaura"></div>
    <div id="cats" style="display:contents"></div>
    <div class="spacer"></div>
    <button class="cat" id="clock-btn"></button>
    <button class="cat" id="tasks-btn"></button>
    <button class="cat" id="logout"></button>
  </nav>
  <section class="main">
    <div class="bar">
      <div>
        <h1 id="cat-title">Menu</h1>
        <div class="sub" id="store"></div>
      </div>
      <label class="search"><span id="search-icon"></span><input id="search" type="search" placeholder="Search the menu" aria-label="Search the menu"></label>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Orders today</div><div class="value num" id="k-orders">0</div></div>
      <div class="kpi"><div class="label">Sales today</div><div class="value num" id="k-sales">0 SAR</div></div>
      <div class="kpi"><div class="label">Helper add-ons today</div><div class="value num" id="k-addons">0</div></div>
    </div>
    <div class="items" id="grid"></div>
  </section>
  <aside class="order" aria-label="Current order">
    <header><h2>Current order</h2><span class="muted num" id="count"></span></header>
    <div class="steps-bar" id="stepsbar"></div>
    <div class="pane" id="pane"></div>
    <div class="totals">
      <div class="r"><span>Subtotal (excl. VAT)</span><span class="num" id="subtotal">0.00 SAR</span></div>
      <div class="r"><span>VAT 15%</span><span class="num" id="vat">0.00 SAR</span></div>
      <div class="r grand"><span>Total</span><span class="num" id="total">0 SAR</span></div>
      <div class="actions" id="actions"></div>
    </div>
  </aside>
</div>
<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header><h2 id="sheet-title">Today's checklists</h2><button class="btn ghost" id="sheet-close">Close</button></header>
    <div id="sheet-body"></div>
  </div>
</div>
<div class="tap" id="tap" hidden>
  <div class="tap-card" role="dialog" aria-modal="true" aria-labelledby="tap-amt">
    <div class="tap-top"><span class="tap-brand">NearPay · Tap to pay</span><button class="tap-x" id="tap-cancel" aria-label="Cancel payment">Cancel</button></div>
    <div class="tap-dots" id="tap-dots"><i class="on"></i><i></i><i></i><i></i></div>
    <div class="tap-ring" id="tap-ring"><svg viewBox="0 0 64 64" aria-hidden="true"><rect x="16" y="6" width="32" height="52" rx="7" fill="none" stroke="currentColor" stroke-width="3"/><path d="M27 26a8 8 0 0 1 0 12M32 22a14 14 0 0 1 0 20M37 18a20 20 0 0 1 0 28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div>
    <div class="tap-say" id="tap-say"><b>Present card or phone</b><span lang="ar" dir="rtl">قدّم البطاقة أو الجوال</span></div>
    <div class="tap-amt num" id="tap-amt">0.00 SAR</div>
    <div class="tap-ar num" lang="ar" dir="rtl" id="tap-amt-ar"></div>
    <button class="btn solid" id="tap-sim">Simulate a card tap (demo)</button>
  </div>
</div>
<div class="sheet-bg center" id="pin-sheet" hidden>
  <div class="pinpad" role="dialog" aria-modal="true" aria-labelledby="pin-title">
    <h2 id="pin-title">Clock in or out</h2>
    <div class="muted">Enter your 4-digit PIN</div>
    <div class="pin-dots" id="pin-dots"></div>
    <div class="keys" id="keys"></div>
    <button class="btn ghost" id="pin-close">Cancel</button>
  </div>
</div>
<script src="/static/icons.js"></script>
<script src="/static/cashier.js"></script>
</body>
</html>
