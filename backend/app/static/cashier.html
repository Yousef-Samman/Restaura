<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Restaura · Cashier</title>
<link rel="icon" href="/static/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="pos">
  <nav class="rail" aria-label="Menu categories">
    <div class="logo"><img src="/static/logo.svg" alt="Restaura"></div>
    <div id="cats" style="display:contents"></div>
    <div class="spacer"></div>
    <button class="cat" id="tasks-btn"></button>
    <button class="cat" id="logout"></button>
  </nav>
  <section class="main">
    <div class="bar">
      <div>
        <h1 id="cat-title">Menu</h1>
        <div class="sub" id="store"></div>
      </div>
      <label class="search"><span id="search-icon"></span><input id="search" type="search" placeholder="Search the menu" aria-label="Search the menu"></label>
    </div>
    <div class="kpis">
      <div class="kpi"><div class="label">Orders today</div><div class="value num" id="k-orders">0</div></div>
      <div class="kpi"><div class="label">Sales today</div><div class="value num" id="k-sales">0 SAR</div></div>
      <div class="kpi"><div class="label">Helper add-ons today</div><div class="value num" id="k-addons">0</div></div>
    </div>
    <div class="items" id="grid"></div>
  </section>
  <aside class="order" aria-label="Current order">
    <header><h2>Current order</h2><span class="muted num" id="count"></span></header>
    <ul class="lines" id="lines"></ul>
    <div class="helper" aria-live="polite">
      <div class="head"><span id="spark"></span>Cashier helper <span class="ai-pill" id="ai-badge"></span></div>
      <div id="suggestions"></div>
    </div>
    <div class="totals">
      <div class="r"><span>Subtotal (excl. VAT)</span><span class="num" id="subtotal">0.00 SAR</span></div>
      <div class="r"><span>VAT 15%</span><span class="num" id="vat">0.00 SAR</span></div>
      <div class="r grand"><span>Total</span><span class="num" id="total">0 SAR</span></div>
      <div class="actions">
        <button class="btn ghost" id="clear">Clear</button>
        <button class="btn solid" id="charge" disabled>Charge</button>
      </div>
    </div>
  </aside>
</div>
<div class="sheet-bg" id="sheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <header><h2 id="sheet-title">Today's checklists</h2><button class="btn ghost" id="sheet-close">Close</button></header>
    <div id="sheet-body"></div>
  </div>
</div>
<script src="/static/icons.js"></script>
<script src="/static/cashier.js"></script>
</body>
</html>
