name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ai:
        description: "Also evaluate the Claude path on this branch (uses the RESTAURA_ANTHROPIC_API_KEY secret, small model). Pushes to main always do."
        type: boolean
        default: false

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - name: Install (the exact versions in requirements.lock)
        run: pip install -r requirements.lock && pip install --no-deps -e .
      - name: Tests, robustness and regression checks
        run: pytest -q
      - name: Evaluation (rules only, no key)
        run: python -m evals --keep-ai
      - name: Evaluation with Claude (every push to main, or by hand)
        if: (github.event_name == 'workflow_dispatch' && inputs.ai) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
        env:
          RESTAURA_ANTHROPIC_API_KEY: ${{ secrets.RESTAURA_ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$RESTAURA_ANTHROPIC_API_KEY" ]; then
            echo "No RESTAURA_ANTHROPIC_API_KEY secret in this repository, so the Claude evaluation is skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            python -m evals --ai
          fi
      - name: Publish the report on the run page
        if: always()
        run: cat evals/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            backend/evals/RESULTS.md
            backend/evals/results/latest.json
