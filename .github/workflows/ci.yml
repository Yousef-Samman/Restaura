name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ai:
        description: "Also evaluate the Claude path (uses the RESTAURA_ANTHROPIC_API_KEY secret, small model)"
        type: boolean
        default: false

jobs:
  test-and-evaluate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev,eval]"
      - name: Tests, robustness and regression checks
        run: pytest -q
      - name: Evaluation (rules only, no key)
        run: python -m evals
      - name: Evaluation with Claude
        if: github.event_name == 'workflow_dispatch' && inputs.ai
        env:
          RESTAURA_ANTHROPIC_API_KEY: ${{ secrets.RESTAURA_ANTHROPIC_API_KEY }}
        run: python -m evals --ai
      - name: Publish the report on the run page
        if: always()
        run: cat evals/RESULTS.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: |
            backend/evals/RESULTS.md
            backend/evals/results/latest.json
